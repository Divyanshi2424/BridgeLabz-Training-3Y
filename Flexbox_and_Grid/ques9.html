<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="ques9.css">
</head>

<body>

    <!-- Flip Card -->
    <div class="card-container">

        <div class="flip-card">

            <!-- Front Side -->
            <div class="card-front">
                <img src="https://media.istockphoto.com/id/1403500817/photo/the-craggies-in-the-blue-ridge-mountains.jpg?s=612x612&w=0&k=20&c=N-pGA8OClRVDzRfj_9AqANnOaDS3devZWwrQNwZuDSk= " alt="Nature">
                <h2>Beautiful Nature</h2>
            </div>

            <!-- Back Side -->
            <div class="card-back">
                <h2>About Nature</h2>
                <p>
                    Nature gives us beautiful landscapes, fresh air
                    and a peaceful environment.
                </p>
            </div>

        </div>

    </div>

</body>

</html>

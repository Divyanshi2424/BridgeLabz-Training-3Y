<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="ques4.css">
</head>

<body>

    <!-- Dashboard Layout -->
    <div class="dashboard">

        <!-- Header -->
        <header>
            <h1>Dashboard</h1>
        </header>

        <!-- Sidebar -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main>

            <div class="card">
                <h2>Users</h2>
                <p>1,250</p>
            </div>

            <div class="card">
                <h2>Projects</h2>
                <p>48</p>
            </div>

            <div class="card">
                <h2>Revenue</h2>
                <p>₹75,000</p>
            </div>

            <div class="card">
                <h2>Tasks</h2>
                <p>320</p>
            </div>

            <div class="card wide">
                <h2>Performance Overview</h2>
                <p>Dashboard performance and activity summary.</p>
            </div>

        </main>

    </div>

</body>

</html>

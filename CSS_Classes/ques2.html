<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="ques2.css">
</head>

<body>

    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Hover over the elements to see tooltips</p>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip-box">
                <span class="icon">🔍</span>
                <span class="tooltip-text">Search for information</span>
                <p>Search</p>
            </div>

            <div class="tooltip-box">
                <span class="icon">🏠</span>
                <span class="tooltip-text">Go to the home page</span>
                <p>Home</p>
            </div>

            <div class="tooltip-box">
                <span class="icon">⚙️</span>
                <span class="tooltip-text">Open settings</span>
                <p>Settings</p>
            </div>

            <div class="tooltip-box">
                <span class="icon">📧</span>
                <span class="tooltip-text">Check your messages</span>
                <p>Email</p>
            </div>

        </section>
    </main>

    <footer>
        <p>© 2026 Tooltip Practice</p>
    </footer>

</body>

</html>

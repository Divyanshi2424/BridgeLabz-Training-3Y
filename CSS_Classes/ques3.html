<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="ques3.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Explore our collection</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1015/500/350" alt="Mountain landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1016/500/350" alt="Beautiful forest">
                    <div class="overlay"></div>
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1018/500/350" alt="Mountain and lake">
                    <div class="overlay"></div>
                </div>
                <figcaption>Lake and Mountains</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1025/500/350" alt="Cute dog">
                    <div class="overlay"></div>
                </div>
                <figcaption>Lovely Dog</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1035/500/350" alt="River landscape">
                    <div class="overlay"></div>
                </div>
                <figcaption>Peaceful River</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1043/500/350" alt="Ocean view">
                    <div class="overlay"></div>
                </div>
                <figcaption>Ocean View</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>© 2026 Image Showcase</p>
    </footer>

</body>

</html>

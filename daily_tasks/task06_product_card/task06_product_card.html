<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="task06.css">
</head>
<body>
    <div class="card">

        <div class="image-box">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQIVMHMhzv8CWf6L-qRv-u7zW3GjLBG4BJpj_r5f8nkXQ&s=10" height="300">

            <div class="discount">
                20% OFF
            </div>

            <div class="heart">
                ♡
            </div>

        </div>

        <div class="details">

            <div class="category">
                SPORTS SHOES
            </div>

            <h2>
                Premium Running Shoes
            </h2>

            <div class="rating">
                ★ ★ ★ ★ ★
                <span class="reviews">(120)</span>
            </div>

            <div class="price">
                <span class="new-price">₹1,999</span>
                <span class="old-price">₹2,499</span>
            </div>

            <button>
                Add to Cart
            </button>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    font-family: Arial, sans-serif;
">

    <!-- Main Card -->
    <div style="
        width: 350px;
        min-height: 500px;
        margin: 30px auto;
        padding: 30px 0 10px 0;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        text-align: center;
    ">

        <!-- Student Circle -->
        <div style="
            width: 132px;
            height: 132px;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            background-color: #dddddd;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888888;
            font-size: 20px;
            font-weight: bold;
        ">
            Student
        </div>


        <!-- Name -->
        <h1 style="
            margin: 0;
            font-size: 29px;
            color: #111111;
            font-weight: bold;
        ">
            Rahul Sharma
        </h1>


        <!-- Course -->
        <h2 style="
            margin: 7px 0 0 0;
            font-size: 20px;
            color: #555555;
            font-weight: bold;
        ">
            Computer Science Engineering
        </h2>


        <!-- College -->
        <p style="
            margin: 8px 0 0 0;
            font-size: 16px;
            color: #777777;
        ">
            ABC Institute of Technology
        </p>


        <!-- Description -->
        <p style="
            width: 290px;
            margin: 23px auto 0 auto;
            font-size: 16px;
            line-height: 25px;
            color: #555555;
        ">
            I am a passionate Computer Science
            student interested in Web Development,
            Java, and problem solving.
        </p>


        <!-- Skills Heading -->
        <h2 style="
            margin: 22px 0 10px 0;
            font-size: 20px;
            color: #555555;
        ">
            Skills
        </h2>


        <!-- Skills -->
        <div style="
            font-size: 16px;
            margin-bottom: 25px;
        ">
            <a href="#" style="
                color: #3675ed;
                margin-right: 4px;
            ">HTML</a>

            <a href="#" style="
                color: #3675ed;
                margin-right: 4px;
            ">CSS</a>

            <a href="#" style="
                color: #3675ed;
                margin-right: 4px;
            ">Java</a>

            <a href="#" style="
                color: #3675ed;
            ">Problem Solving</a>
        </div>


        <!-- Contact Button -->
        <button style="
            width: 133px;
            height: 43px;
            border: none;
            border-radius: 8px;
            background-color: #2867e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        ">
            Contact Me
        </button>

    </div>

</body>
</html>

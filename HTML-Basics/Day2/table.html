<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Table Practice</title>
</head>
<body>

    <h2>Simple Table Example</h2>

    <!-- Table 1 -->
    <table border="1">
        <!-- Table title/heading ke liye caption tag -->
        <caption>Table-1</caption>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        
        <!-- Data Row 1 -->
        <tr>
            <td>Rahul</td>
            <td>HTML</td>
            <td>85</td>
        </tr>

        <!-- Data Row 2 -->
        <tr>
            <td>Priya</td>
            <td>CSS</td>
            <td>90</td>
        </tr>
    </table>

    <br> <!-- Dono tables ke beech spacing ke liye -->

    <!-- Table 2 -->
    <table border="1">
        <caption>Table-2</caption>
        <tr>
            <th rowspan="3">Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        
        <!-- Data Row 1 -->
        <tr>
            <td>HTML</td>
            <td>85</td>
        </tr>
    </table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced CSS Selectors</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="ques5.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Advanced CSS Selectors</h1>
        <p>CSS Selectors Demonstration</p>
    </header>


    <!-- Main content -->
    <main>

        <!-- Attribute selector section -->
        <section>

            <h2>Attribute Selectors</h2>

            <!-- type="text" -->
            <input type="text" placeholder="Enter your name">

            <!-- type="email" -->
            <input type="email" placeholder="Enter your email">

            <br><br>

            <!-- HTTPS link -->
            <a href="https://www.google.com">
                Visit Secure Website
            </a>

        </section>


        <!-- Pseudo-class and pseudo-element section -->
        <section>

            <h2>Learning Topics</h2>

            <ul class="topics">

                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>React</li>
                <li>Python</li>

            </ul>

        </section>


        <!-- Combinator section -->
        <section>

            <h2>Combinators</h2>

            <div class="parent">

                <!-- Direct child -->
                <p>First Paragraph</p>

                <div class="child">

                    <!-- Nested paragraph -->
                    <p>Nested Paragraph</p>

                </div>

                <!-- Direct child -->
                <p>Second Paragraph</p>

                <!-- Sibling -->
                <span>Span Element</span>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Advanced CSS Selectors</p>
    </footer>

</body>

</html>
